[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Defensive: explicitly refuse CDN caching on NextAuth's own routes. Kept
# even though it turned out NOT to be the actual fix for the MissingCSRF
# bug hit on 2026-08-28 (that was a duplicate-Set-Cookie issue caused by
# proxy.ts's middleware matcher wrapping these routes — fixed by excluding
# api/auth from that matcher entirely, see proxy.ts). Still correct hygiene
# to keep regardless.
[[headers]]
  for = "/api/auth/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"
