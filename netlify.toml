[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# NextAuth's CSRF double-submit cookie was breaking with a "MissingCSRF"
# login error — the response for GET /api/auth/csrf came back with TWO
# different Set-Cookie headers for the same csrf-token cookie name (a
# duplicate/racing origin execution, evidence pointed at Netlify's durable
# caching layer even though the route already sends Cache-Control: no-store
# itself — that header alone wasn't enough to opt out). Force Netlify's own
# CDN-level header to explicitly refuse to cache/duplicate every auth route.
[[headers]]
  for = "/api/auth/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"
